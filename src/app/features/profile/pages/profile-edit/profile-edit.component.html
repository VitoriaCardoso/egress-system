<h1>Editar Informações</h1>
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-edit">
	<div class="row">
		<div class="col-12 col-lg-3">
			<app-input id="name" label="Nome" formControlName="name"></app-input>
		</div>
		<div class="col-12 col-lg-3">
			<app-input id="nome_social" label="Nome Social" formControlName="nome_social"></app-input>
		</div>
		<div class="col-12 col-lg-3">
			<app-input id="cpf" label="CPF" formControlName="cpf"></app-input>
		</div>
	</div>
	<div class="row">
		<div class="col-12 col-lg-3">
			<app-input id="email" label="E-mail" type="email" formControlName="email"></app-input>
		</div>
		<div class="col-12 col-lg-3">
			<app-input id="email_secundario" label="E-mail Secundário" type="email" formControlName="email_secundario">
				@if (form.get('email_secundario').hasError('email')) {
					<span br-feedback state="warning"> E-mail inválido </span>
				}
			</app-input>
		</div>
		<div class="col-12 col-lg-3">
			<app-input id="phone" label="Telefone" mask="(00) 00000-0000" formControlName="phone"></app-input>
		</div>
		<div class="col-12 col-lg-3">
			<app-input
				id="telefone_secundario"
				label="Telefone Secundário"
				mask="(00) 00000-0000"
				formControlName="telefone_secundario"
			></app-input>
		</div>
	</div>
	<div class="row">
		<div class="col-12 col-lg-3">
			<app-input id="link_lattes" label="Link do Lattes" formControlName="link_lattes"></app-input>
		</div>
		<div class="col-12 col-lg-3">
			<app-input id="link_orcid" label="Link do ORCID" formControlName="link_orcid"></app-input>
		</div>
		<div class="col-12 col-lg-3">
			<app-input id="link_linkedin" label="Link do LinkedIn" formControlName="link_linkedin"></app-input>
		</div>
		<div class="col-12 col-lg-3 d-flex align-items-end justify-content-lg-end justify-content-center mt-4 mt-md-0">
			<button br-button color="primary">Salvar</button>
		</div>
	</div>
</form>
