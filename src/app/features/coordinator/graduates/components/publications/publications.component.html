@if (data.length) {
	@for (publication of data; track publication.id; let first = $first) {
		<app-collapse-item [label]="publication.title" [id]="publication.id.toString()" [expanded]="first">
			<ng-container *ngTemplateOutlet="templateRef; context: { $implicit: publication }"></ng-container>
		</app-collapse-item>
		@if (!$last) {
			<hr class="divider" />
		}
	}
} @else {
	@if (data.length === 1) {
		<ng-container *ngTemplateOutlet="templateRef; context: { $implicit: data[0] }"></ng-container>
	} @else {
		<p>Nenhuma publicação cadastrada.</p>
	}
}

<ng-template #templateRef let-publication>
	<div class="row">
		<div class="col-12 col-lg-3">
			<app-item-info label="Título da Publicação" [value]="publication.title"></app-item-info>
		</div>
		<div class="col-12 col-lg-3">
			<app-item-info label="Autores" [value]="publication.autores"></app-item-info>
		</div>
		<div class="col-12 col-lg-3">
			<app-item-info label="Ano da Publicação" [value]="publication.ano_publicacao.toString()"></app-item-info>
		</div>
		<div class="col-12 col-lg-3">
			<app-item-info label="Veículo" [value]="publication.veiculo"></app-item-info>
		</div>
		<div class="col-12 col-lg-3">
			<app-item-info
				label="URL da Publicação"
				type="url_publicacao"
				[value]="publication.url_publicacao"
			></app-item-info>
		</div>
		<div class="col-12 col-lg-3">
			<app-item-info label="Curso" [value]="publication.informacao_academica"></app-item-info>
		</div>
		<div class="col-12 col-lg-3">
			<app-item-info label="Identificador" [value]="publication.matricula"></app-item-info>
		</div>
	</div>
</ng-template>
