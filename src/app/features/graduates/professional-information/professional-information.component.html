<div class="btn-new">
	<button [routerLink]="['/informacoes/profissionais/novo']" br-button color="primary">Nova Experiência</button>
</div>
<h1>Informações Profissionais</h1>
@for (info of data; track info.id; let first = $first) {
	<app-collapse-item [label]="info | titleCollapseProfessionalInformation" [id]="info.id.toString()" [expanded]="first">
		<div class="btn-edit">
			<button
				br-button
				size="small"
				[routerLink]="['/informacoes/profissionais/editar/', info.id]"
				color="secondary"
				icon="fa-edit"
			>
				Editar Experiência
			</button>
		</div>
		<div class="row">
			<div class="col-12 col-lg-3">
				<app-item-info label="Nome da Empresa" [value]="info.company_name"></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info label="Categoria" [value]="info.category | getCategoryDescription"></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info label="Tipo de Emprego" [value]="info.job_type | getjob_typeDescription"></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info label="Localidade" [value]="info.location | getLocationDescription"></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info label="Cargo" [value]="info.job_title"></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info label="Nível de Cargo" [value]="info.job_level | getjob_levelDescription"></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info label="Data de Início" [value]="info.start_date | date: 'dd/MM/yyyy'"></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				@if (info.end_date) {
					<app-item-info label="Data de Término" [value]="info.end_date | date: 'dd/MM/yyyy'"></app-item-info>
				} @else {
					<app-item-info label="Data de Término" value="--"></app-item-info>
				}
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info label="Média Salarial" [value]="info.salary | currency"></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info label="Função" [value]="info.function || '--'"></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info
					label="Informações Acadêmicas Relacionadas"
					[value]="info.informacao_academica.course_name"
				></app-item-info>
			</div>
			<div class="col-12 col-lg-3">
				<app-item-info label="Identificador" [value]="info.id.toString()"></app-item-info>
			</div>
		</div>
	</app-collapse-item>
	@if (!$last) {
		<hr class="divider" />
	}
}
<div class="btn-new-mobile">
	<button [routerLink]="['/informacoes/profissionais/novo']" br-button color="primary">Nova Experiência</button>
</div>
